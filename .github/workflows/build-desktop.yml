name: Build Desktop (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Finds the app folder (the one that holds package.json) automatically, so the build works whether the
      # files were uploaded to the repo root or inside a sub-folder (e.g. "clinixstudy-app/").
      - name: Locate project folder
        id: proj
        shell: bash
        run: |
          DIR=""
          for f in $(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' -not -path './.git/*' | awk '{print length, $0}' | sort -n | cut -d' ' -f2-); do
            if grep -q '"name"[[:space:]]*:[[:space:]]*"clinixstudy"' "$f"; then DIR=$(dirname "$f"); break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::package.json (name: clinixstudy) was not found in this repository. Upload the project files themselves (package.json, src/, electron/ ...) to the repo."
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm install

      - name: Build web app + Windows installer
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm run desktop:build
        env:
          # Optional: same GEMINI_API_KEY secret as the APK build
          VITE_GEMINI_API_KEY: ${{ vars.GATEWAY_URL == '' && secrets.GEMINI_API_KEY || '' }}
          VITE_GROQ_API_KEY: ${{ vars.GATEWAY_URL == '' && secrets.GROQ_API_KEY || '' }}
          VITE_OPENROUTER_API_KEY: ${{ vars.GATEWAY_URL == '' && secrets.OPENROUTER_API_KEY || '' }}
          VITE_MISTRAL_API_KEY: ${{ vars.GATEWAY_URL == '' && secrets.MISTRAL_API_KEY || '' }}
          # v3.32 · AI gateway (gateway/README.md): repo VARIABLE GATEWAY_URL + repo SECRET GATEWAY_TOKEN. When the gateway is on, NO provider key is baked into the app
          # (an app file is a zip: anything baked in can be read out of it), so the four keys below are emptied.
          VITE_GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          VITE_GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          VITE_PAID: ${{ vars.PAID_KEY }}                  # set PAID_KEY=1 if you use your own PAID Google key directly (no gateway)
          VITE_SERVICE_TIER: ${{ vars.SERVICE_TIER }}      # optional: priority (Google Tier 2+)

      - name: Upload installer + portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ClinixStudy-windows
          path: |
            ${{ steps.proj.outputs.dir }}/release/ClinixStudy-Setup-*.exe
            ${{ steps.proj.outputs.dir }}/release/ClinixStudy-Portable-*.exe
